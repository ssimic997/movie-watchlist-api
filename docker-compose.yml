version: '3.9'
services:
    db:
        image: 'postgres:15.5'
        env_file: '.env'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgre-data:/var/lib/postgresql/data/
        restart: always

    redis:
        image: 'redis'
        env_file: '.env'
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        restart: always


volumes:
    postgre-data:
    redis-data:
